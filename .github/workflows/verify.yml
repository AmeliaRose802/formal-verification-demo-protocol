name: Verify (SAW + Cryptol)

# Runs the four-layer demo_protocol verification on every PR and on
# pushes to main, on both Ubuntu and Windows runners.
#
# The 4 layers (see verify_all.ps1 for the full contract):
#   1. SAW + Z3 — C++ decision functions ≡ Cryptol byte-width model
#   2. SAW + Z3 — Rust decision functions ≡ Cryptol byte-width model
#   3. Cryptol + Z3 — every `property` in cpp/saw/SDEP_cpp.cry holds
#   4. Cryptol + Z3 — every gap in cryptol/SDEP_gaps.cry still produces
#      a counterexample (= the documented attacker-visible gap is real)
#
# Layer 2 (Rust) runs in its own `verify-rust-linux` job with
# `continue-on-error: true` so its WIP status doesn't fail the
# pipeline. The main `verify-{linux,windows}` jobs pass `-SkipRust`
# and only cover layers 1 / 3 / 4. Once Rust verification is stable,
# drop `continue-on-error` and merge the Rust layer back into the
# main jobs.
#
# Toolchain (installed by scripts/ci-install.ps1, cached per-OS):
#   LLVM 20.1.6, SAW 1.5 with bundled solvers, saw-spec-gen (latest),
#   plus the in-workflow Rust stable toolchain (Rust job only).

on:
  pull_request:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'rust/**'
      - 'cryptol/**'
      - 'verify_all.ps1'
      - 'scripts/ci-install.ps1'
      - 'Dockerfile'
      - '.github/workflows/verify.yml'
      - '.github/workflows/publish-ci-image.yml'
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'rust/**'
      - 'cryptol/**'
      - 'verify_all.ps1'
      - 'scripts/ci-install.ps1'
      - 'Dockerfile'
      - '.github/workflows/verify.yml'
      - '.github/workflows/publish-ci-image.yml'
  workflow_dispatch:

concurrency:
  # Cancel in-flight runs for the same PR/branch when a new commit lands.
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast lane: build + unit tests for both implementations ────────
  # Runs in parallel with the much slower `verify` job below. No SAW,
  # no LLVM 20 download — just the system C++ toolchain (gcc on Linux,
  # MSVC on Windows) and Rust stable. Catches the kinds of regressions
  # (compile errors, broken unit tests) that don't need formal proof
  # to surface, and gives reviewers fast feedback before the proof
  # job finishes.
  build-test:
    name: build + unit tests, Rust + C++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust: build + test (default features, with std::collections etc.)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry (build-test)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-build-test-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-build-test-cargo-

      - name: cargo build (lib)
        working-directory: rust
        run: cargo build --release --lib

      - name: cargo test (lib unit tests)
        working-directory: rust
        # Scope: in-module #[cfg(test)] unit tests in src/lib.rs (~20 tests).
        # Integration tests (tests/*.rs) and examples are intentionally
        # excluded — they currently fail to compile against the live
        # canonicalize_payload signature and should be fixed in a
        # follow-up PR before being added back to the gate.
        run: cargo test --release --lib

      # ── C++: CMake configure + build + ctest ──────────────────────
      # CMake auto-discovers the host compiler — gcc on Ubuntu runners,
      # MSVC on Windows runners. The same CMakeLists.txt covers both;
      # `-C Release` matters only for multi-config generators (MSVC).
      - name: Configure C++ (cmake)
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ (cmake --build)
        run: cmake --build cpp/build --config Release --parallel

      - name: Run C++ tests (ctest)
        run: ctest --test-dir cpp/build -C Release --output-on-failure

  # ── Wait for the pre-baked toolchain image to be available ────────
  # The image is published by .github/workflows/publish-ci-image.yml,
  # which fires on the same PR push when the Dockerfile / installer
  # changes. verify-linux runs `container: ghcr.io/.../latest` which
  # pulls before any step runs, so we can't wait *inside* that job —
  # if `:latest` doesn't exist yet the runner fails at image-pull.
  # This job blocks verify-linux until the registry has a usable tag,
  # giving the publish workflow time to finish. On PRs that don't
  # change the image, `:latest` is already there and this returns
  # almost immediately.
  wait-for-image:
    name: wait for CI image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Poll GHCR for ghcr.io/.../formal-verification-demo-protocol-ci:latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo_lower="$(basename '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lower}/${repo_lower}-ci:latest"
          echo "Polling for ${image}..."
          # Use the Docker Registry HTTP API directly; gh CLI / docker
          # pull would also work but the manifest endpoint is the
          # cheapest readiness probe and works against private packages
          # with GITHUB_TOKEN.
          token="$(echo -n "${{ github.actor }}:${GH_TOKEN}" | base64 -w0)"
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${owner_lower}/${repo_lower}-ci/manifests/latest" || echo 000)
            if [ "${code}" = "200" ]; then
              echo "Image ready (HTTP ${code}) after $((i*15))s."
              exit 0
            fi
            echo "  [$i/60] not ready (HTTP ${code}), sleeping 15s..."
            sleep 15
          done
          echo "::error::CI image never became ready. Check the 'Publish CI image' workflow."
          exit 1

  # ── Slow lane (Linux): SAW + Cryptol proof (layers 1 / 3 / 4), in container ─
  # Runs inside the pre-baked image published by publish-ci-image.yml.
  # The image already contains LLVM 20.1.6, SAW 1.5, PowerShell 7,
  # Rust stable + llvm-tools-preview, and saw-spec-gen at the same
  # $HOME/.demo_protocol/{llvm,saw,bin} paths the local installer
  # uses, with CLANG_BIN / SAW_EXE / SAW_SPEC_GEN / SOLVER_BIN /
  # CRYPTOL_EXE / RUSTUP_LLVM_BIN already set via ENV. No install step,
  # no ~1 GB tarball download — just checkout + verify_all.ps1.
  #
  # Passes `-SkipRust` so Layer 2 (Rust ≡ Cryptol) is left to the
  # separate non-blocking `verify-rust-linux` job below.
  verify-linux:
    name: verify C++ + Cryptol (ubuntu-22.04, container)
    runs-on: ubuntu-22.04
    needs: wait-for-image
    timeout-minutes: 60
    container:
      image: ghcr.io/ameliarose802/formal-verification-demo-protocol-ci:latest
      # GITHUB_TOKEN works for both public and private GHCR packages,
      # so this stays green even before package visibility is flipped.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run verify_all.ps1 (skip Rust)
        shell: pwsh
        run: pwsh -NoProfile -File verify_all.ps1 -SkipRust

      - name: Upload SAW verify_out on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify_out-cpp-cryptol-ubuntu-22.04
          path: |
            verify_out/**
            cpp/saw/out_*/saw_run.log
          if-no-files-found: ignore
          retention-days: 14

  # ── Slow lane (Windows): SAW + Cryptol proof (layers 1 / 3 / 4), via cached installer ─
  # Hosted windows-* runners don't support the `container:` job key and
  # the available Windows base images are multi-GB pulls that wipe out
  # any cold-start savings. Stick with the cached tarball install: the
  # first run pays the install cost, subsequent runs hit the cache.
  #
  # Passes `-SkipRust` so Layer 2 (Rust ≡ Cryptol) is left to the
  # separate non-blocking `verify-rust-linux` job. Rust toolchain +
  # cargo cache are intentionally absent here — they're only used by
  # the Rust layer, which doesn't run in this job.
  #
  # Budget note: the cold-cache `Install verification toolchain` step
  # historically took ~55–60 min on hosted windows-2022 runners (LLVM
  # extract dominated by bsdtar's single-threaded xz decode + Defender
  # AV scanning of thousands of small files). Two-pronged fix:
  #   1. Toolchain caches split into LLVM / SAW / saw-spec-gen, each
  #      keyed on the tool version (not the installer-script hash).
  #      That way unrelated edits to ci-install.ps1 don't blow the
  #      ~1 GB LLVM cache. Borrowed from saw-spec-gen / llvm-exception-
  #      lower's CI which solved the same problem.
  #   2. ci-install.ps1 prefers 7zip on Windows (multi-threaded xz),
  #      which alone cuts cold extracts from ~40 min to ~10 min.
  # First uninterrupted run still pays the full cold-install cost while
  # populating the caches; every subsequent run finishes in minutes
  # even when ci-install.ps1 changes.
  verify-windows:
    name: verify C++ + Cryptol (windows-2022) [non-blocking until cache warms]
    runs-on: windows-2022
    # Non-blocking for the same reason verify-rust-linux is: the cold-cache
    # install on hosted windows-2022 runners can still take ~10–15 min
    # the very first time, and `concurrency.cancel-in-progress: true`
    # above will cancel the run before the cache-save step ever fires
    # if a new commit lands in that window. Once a single push runs
    # uninterrupted the version-keyed caches populate and subsequent
    # runs finish in minutes — at which point this can flip back to
    # `continue-on-error: false`.
    continue-on-error: true
    timeout-minutes: 120

    env:
      # Single source of truth for the versions ci-install.ps1 will
      # install. Embedded in the cache keys below so a version bump
      # is the only thing that invalidates the cache.
      DEMO_LLVM_VERSION: '20.1.6'
      DEMO_SAW_VERSION: '1.5'
      # Cache-key generation suffix. Bump to invalidate all toolchain
      # caches without changing a tool version (e.g. corrupted cache).
      DEMO_CACHE_REV: 'v1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Per-tool toolchain caches ─────────────────────────────────
      # Each tool gets its own cache under ~/.demo_protocol/<tool>/.
      # ci-install.ps1 already short-circuits each Step when its target
      # binary (bin/clang, bin/saw, bin/saw-spec-gen) is already in
      # place, so a cache hit makes the step a no-op for that tool.
      #
      # Keys are intentionally tied to TOOL VERSION (not installer
      # script hash) so editing ci-install.ps1 — which we do often
      # while iterating on CI — doesn't trash the ~1 GB LLVM cache.
      # Borrowed from llvm-exception-lower's CI which uses the same
      # pattern: `key: llvm-20.1.6-windows-x64-saw-e2e`.
      - name: Restore LLVM cache
        id: restore-llvm
        uses: actions/cache/restore@v4
        with:
          path: ~/.demo_protocol/llvm
          key: windows-demo_protocol-llvm-${{ env.DEMO_LLVM_VERSION }}-${{ env.DEMO_CACHE_REV }}

      - name: Restore SAW cache
        id: restore-saw
        uses: actions/cache/restore@v4
        with:
          path: ~/.demo_protocol/saw
          key: windows-demo_protocol-saw-${{ env.DEMO_SAW_VERSION }}-${{ env.DEMO_CACHE_REV }}

      # saw-spec-gen tracks `latest` by default; its cache is small
      # (<100 MB) so we key it on the installer-script hash. Cheap to
      # rebuild when invalidated, and gets refreshed any time the
      # script changes (which is also when a tag bump would land).
      - name: Restore saw-spec-gen cache
        id: restore-ssg
        uses: actions/cache/restore@v4
        with:
          path: ~/.demo_protocol/bin
          key: windows-demo_protocol-ssg-${{ hashFiles('scripts/ci-install.ps1') }}-${{ env.DEMO_CACHE_REV }}

      - name: Install verification toolchain
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-install.ps1 -WriteGithubPath -LlvmVersion $env:DEMO_LLVM_VERSION -SawVersion $env:DEMO_SAW_VERSION

      # Split restore/save so the (slow) tool install is still cached
      # even when verification itself fails. `if: always() && cache-hit
      # != 'true'` ensures we save exactly the cache(s) that were cold.
      - name: Save LLVM cache
        if: always() && steps.restore-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.demo_protocol/llvm
          key: ${{ steps.restore-llvm.outputs.cache-primary-key }}

      - name: Save SAW cache
        if: always() && steps.restore-saw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.demo_protocol/saw
          key: ${{ steps.restore-saw.outputs.cache-primary-key }}

      - name: Save saw-spec-gen cache
        if: always() && steps.restore-ssg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.demo_protocol/bin
          key: ${{ steps.restore-ssg.outputs.cache-primary-key }}

      - name: Run verify_all.ps1 (skip Rust)
        shell: pwsh
        run: pwsh -NoProfile -File verify_all.ps1 -SkipRust

      - name: Upload SAW verify_out on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify_out-cpp-cryptol-windows-2022
          path: |
            verify_out/**
            cpp/saw/out_*/saw_run.log
          if-no-files-found: ignore
          retention-days: 14

  # ── Rust verification (non-blocking, WIP) ─────────────────────────
  # Layer 2: SAW + Z3 proof that the sdep crate's pure decision
  # functions are equivalent to their Rust-ABI Cryptol models.
  #
  # Marked `continue-on-error: true` because the Rust verification
  # pipeline is still under active development — chrono-based functions
  # (is_valid_request_date) need override-spec infrastructure that's
  # not wired up yet. The job still runs on every PR so we can track
  # progress and catch regressions on the Rust paths that DO verify,
  # but a failure here doesn't block merges.
  #
  # Linux-only for now (container = no install step, fastest signal).
  # When the pipeline stabilises, fold this back into verify-linux /
  # verify-windows and drop `continue-on-error`.
  verify-rust-linux:
    name: verify Rust (ubuntu-22.04, container) [non-blocking]
    runs-on: ubuntu-22.04
    needs: wait-for-image
    continue-on-error: true
    timeout-minutes: 30
    container:
      image: ghcr.io/ameliarose802/formal-verification-demo-protocol-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cargo registry/build cache only — the toolchain is baked in.
      - name: Cache cargo registry (Rust layer)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: linux-verify-rust-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: |
            linux-verify-rust-cargo-

      - name: Run rust/saw/run.ps1
        shell: pwsh
        working-directory: rust/saw
        run: pwsh -NoProfile -File ./run.ps1

      - name: Upload Rust SAW logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify_out-rust-ubuntu-22.04
          path: |
            rust/saw/saw_run.log
            rust/saw/sdep.ll
            rust/saw/sdep_patched.ll
            rust/saw/verify.saw
            rust/saw/specs_scaffold/**
          if-no-files-found: ignore
          retention-days: 14
