# Regenerate the docs from source and publish them to GitHub Pages,
# automatically, on every push to `main`.
#
# Why this exists
# ---------------
# Previously the published site only refreshed when someone ran the
# pretty-specs pipeline *locally* (scripts/regen-docs.ps1), committed the
# regenerated docs/, and opened a PR — then pages.yml deployed the
# committed docs/. This workflow removes that manual loop: when source
# (Cryptol model, C++/Rust implementations, extra docs, assets, docfx
# config) lands on `main`, CI re-runs the exact same pipeline inside the
# verification toolchain container and deploys the freshly rendered site.
#
# It publishes the *freshly rendered* _site rather than committing docs/
# back to the repo, so it never needs write access to a protected `main`
# and can't create an auto-commit trigger loop. The committed docs/ in the
# repo remains the last human-reviewed snapshot; the live site always
# reflects current source. (pages.yml stays as a manual fallback that
# deploys the committed docs/.)
#
# Toolchain
# ---------
# - The container image already bundles LLVM, SAW, Z3, Cryptol and pwsh.
# - The pretty-specs renderer (repo AmeliaRose802/crystal-cryptal, which
#   ships pipeline.ps1 and builds the `pretty-specs` binary) and
#   saw-spec-gen (the spec generator) live in separate public repos and
#   are checked out + built here, mirroring scripts/regen-docs.ps1.
#   pipeline.ps1 builds saw-spec-gen from its source root; we pre-build
#   pretty-specs.
# - Both tool repos are public, so the default `github.token` reads them;
#   no extra secret is required. If/when crystal-cryptal publishes a
#   prebuilt release binary, the "Build pretty-specs" step can be swapped
#   for a release download.

name: Regenerate docs and publish

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'rust/**'
      - 'cryptol/**'
      - 'extra_docs/**'
      - 'assets/**'
      - 'coverage.toml'
      - 'docfx.json'
      - 'scripts/regen-docs.ps1'
      - '.github/workflows/regen-and-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the Pages concurrency group with pages.yml so the two never try to
# deploy at the same time. Don't cancel an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Regenerate docs/ + proof_manifest.json inside the toolchain image ──
  regen:
    name: Regenerate docs (toolchain container)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ameliarose802/formal-verification-demo-protocol-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout demo_protocol
        uses: actions/checkout@v4

      - name: Checkout crystal-cryptal (pretty-specs renderer + pipeline.ps1)
        uses: actions/checkout@v4
        with:
          repository: AmeliaRose802/crystal-cryptal
          ref: master
          path: .tools/crystal-cryptal

      - name: Checkout saw-spec-gen (spec generator)
        uses: actions/checkout@v4
        with:
          repository: AmeliaRose802/saw-spec-gen
          path: .tools/saw-spec-gen

      - name: Cache cargo + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools/crystal-cryptal/target
            .tools/saw-spec-gen/target
          key: regen-cargo-${{ hashFiles('.tools/crystal-cryptal/Cargo.lock', '.tools/saw-spec-gen/Cargo.lock') }}
          restore-keys: |
            regen-cargo-

      - name: Build pretty-specs
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location .tools/crystal-cryptal
          cargo build --release
          Pop-Location

      - name: Regenerate docs + proof manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $pretty   = (Resolve-Path '.tools/crystal-cryptal/target/release/pretty-specs').Path
          $pipeline = (Resolve-Path '.tools/crystal-cryptal/pipeline.ps1').Path
          $ssgRoot  = (Resolve-Path '.tools/saw-spec-gen').Path
          $ssgBin   = Join-Path $ssgRoot 'target/release/saw-spec-gen'

          # Clean prior outputs so we never publish a stale mixture.
          Remove-Item -Recurse -Force verify_out, docs, proof_manifest.json, pipeline.log -ErrorAction SilentlyContinue

          & $pipeline `
            -Spec cpp/saw/SDEP_cpp.cry `
            -Impl cpp/src/decision.cpp -ImplLang cpp `
            -CxxIncludeDirs cpp/include -CxxStandard c++20 `
            -ExtraClangFlags '-fexceptions','-fno-inline' `
            -PrettySpecs $pretty `
            -SawSpecGen $ssgBin `
            -SawSpecGenRoot $ssgRoot `
            -Output docs -VerifyOutput verify_out `
            -ExtraDocs 'extra_docs:Formal Verification' `
            -Logo assets/sat-pudding.png `
            -Favicon assets/fabicon.png `
            *>&1 | Tee-Object pipeline.log

          if (-not (Test-Path docs/index.md)) {
            throw "Regeneration failed: docs/ was not produced. See pipeline.log."
          }

      - name: Package rendered tree for the build job
        run: |
          # Hand the freshly rendered tree to the docfx job. Exclude the
          # heavy/irrelevant dirs: git metadata, SAW output, and the
          # checked-out tool sources.
          tar `
            --exclude='./.git' `
            --exclude='./verify_out' `
            --exclude='./.tools' `
            -czf rendered.tar.gz .

      - name: Upload rendered tree
        uses: actions/upload-artifact@v4
        with:
          name: rendered-tree
          path: rendered.tar.gz
          retention-days: 3

      - name: Upload pipeline log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regen-pipeline-log
          path: pipeline.log
          if-no-files-found: ignore
          retention-days: 7

  # ── 2. Render the DocFX site from the regenerated docs/ ──────────────────
  build:
    name: Build DocFX site
    needs: regen
    runs-on: ubuntu-latest
    steps:
      - name: Download rendered tree
        uses: actions/download-artifact@v4
        with:
          name: rendered-tree

      - name: Unpack rendered tree
        run: tar -xzf rendered.tar.gz

      - name: Set up .NET (for docfx tool)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build site
        run: docfx docfx.json --warningsAsErrors false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── 3. Deploy to GitHub Pages ────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
