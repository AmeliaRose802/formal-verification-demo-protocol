# Regenerate the docs from source and publish them to GitHub Pages,
# automatically, on every push to `main`.
#
# Why this exists
# ---------------
# Previously the published site only refreshed when someone ran the
# pretty-specs pipeline *locally* (scripts/regen-docs.ps1), committed the
# regenerated docs/, and opened a PR — then pages.yml deployed the
# committed docs/. This workflow removes that manual loop: when source
# (Cryptol model, C++/Rust implementations, extra docs, assets, docfx
# config) lands on `main`, CI re-runs the exact same pipeline inside the
# verification toolchain container and deploys the freshly rendered site.
#
# It publishes the *freshly rendered* _site rather than committing docs/
# back to the repo, so it never needs write access to a protected `main`
# and can't create an auto-commit trigger loop. The committed docs/ in the
# repo remains the last human-reviewed snapshot; the live site always
# reflects current source. (pages.yml stays as a manual fallback that
# deploys the committed docs/.)
#
# Toolchain
# ---------
# - The container image already bundles LLVM, SAW, Z3, Cryptol and pwsh.
# - The pretty-specs renderer is consumed as a *published binary* from the
#   public AmeliaRose802/crystal-cryptal GitHub Release (pinned via
#   PRETTY_SPECS_VERSION below), so no Rust build of the renderer is needed.
# - saw-spec-gen (the spec generator) is likewise consumed as a *published
#   binary* from its GitHub Release (pinned via SAW_SPEC_GEN_VERSION below)
#   and driven through its native `verify-cpp` CLI command. The workflow
#   therefore needs no saw-spec-gen checkout, no from-source `cargo build`,
#   and none of the PowerShell wrappers (verify.ps1 / scripts/vendor/
#   pipeline.ps1): it calls pretty-specs and `verify-cpp` directly in the
#   "Regenerate docs" step below.

name: Regenerate docs and publish

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'rust/**'
      - 'cryptol/**'
      - 'extra_docs/**'
      - 'assets/**'
      - 'coverage.toml'
      - 'docfx.json'
      - 'scripts/regen-docs.ps1'
      - '.github/workflows/regen-and-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pinned published tools. Bump each tag together with its SHA256 digest.
env:
  PRETTY_SPECS_VERSION: v0.3.0
  PRETTY_SPECS_SHA256: e26a55df3b909ac92ca5f8af6f3c923d7c2e42f2fbb281f15352253cc620377b
  # Published spec-generator binary, driven via its `verify-cpp` CLI.
  # Bump the tag and digest together when upgrading.
  SAW_SPEC_GEN_VERSION: v0.1.0
  SAW_SPEC_GEN_SHA256: 9131d6fda82a50d7f542d1400a9710835b5a7bd1c9ff266f87385e3b5e5a99d4

# Share the Pages concurrency group with pages.yml so the two never try to
# deploy at the same time. Don't cancel an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Regenerate docs/ + proof_manifest.json inside the toolchain image ──
  regen:
    name: Regenerate docs (toolchain container)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ameliarose802/formal-verification-demo-protocol-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout demo_protocol
        uses: actions/checkout@v4

      - name: Download pretty-specs ${{ env.PRETTY_SPECS_VERSION }} (published binary)
        run: |
          $ErrorActionPreference = 'Stop'
          $ver   = $env:PRETTY_SPECS_VERSION
          $asset = "pretty-specs-$ver-x86_64-unknown-linux-gnu.tar.gz"
          $url   = "https://github.com/AmeliaRose802/crystal-cryptal/releases/download/$ver/$asset"
          New-Item -ItemType Directory -Force -Path .tools/pretty-specs, .tools/bin | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile ".tools/$asset"

          # Verify against the pinned digest so a moved/retagged asset can't slip in.
          $actual = (Get-FileHash ".tools/$asset" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:PRETTY_SPECS_SHA256) {
            throw "pretty-specs asset sha256 mismatch: got $actual expected $($env:PRETTY_SPECS_SHA256)"
          }

          tar -xzf ".tools/$asset" -C .tools/pretty-specs
          $found = @(Get-ChildItem -Recurse -File -Path .tools/pretty-specs -Filter pretty-specs)
          if ($found.Count -eq 0) { throw "pretty-specs binary not found inside $asset" }
          Copy-Item $found[0].FullName .tools/bin/pretty-specs -Force
          & chmod '+x' .tools/bin/pretty-specs
          # Smoke test: the binary has no --version flag (usage is
          # `pretty-specs --favicon <PATH> [INPUTS]...`); --help exits 0.
          & .tools/bin/pretty-specs --help
          if ($LASTEXITCODE -ne 0) { throw "pretty-specs --help failed (exit $LASTEXITCODE)" }

      - name: Download saw-spec-gen ${{ env.SAW_SPEC_GEN_VERSION }} (published binary)
        run: |
          $ErrorActionPreference = 'Stop'
          $ver   = $env:SAW_SPEC_GEN_VERSION
          $asset = 'saw-spec-gen-linux-x86_64.tar.gz'
          $url   = "https://github.com/AmeliaRose802/saw-spec-gen/releases/download/$ver/$asset"
          New-Item -ItemType Directory -Force -Path .tools/saw-spec-gen, .tools/bin | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile ".tools/$asset"

          # Verify against the pinned digest so a moved/retagged asset can't slip in.
          $actual = (Get-FileHash ".tools/$asset" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:SAW_SPEC_GEN_SHA256) {
            throw "saw-spec-gen asset sha256 mismatch: got $actual expected $($env:SAW_SPEC_GEN_SHA256)"
          }

          tar -xzf ".tools/$asset" -C .tools/saw-spec-gen
          $found = @(Get-ChildItem -Recurse -File -Path .tools/saw-spec-gen -Filter saw-spec-gen)
          if ($found.Count -eq 0) { throw "saw-spec-gen binary not found inside $asset" }
          Copy-Item $found[0].FullName .tools/bin/saw-spec-gen -Force
          & chmod '+x' .tools/bin/saw-spec-gen
          & .tools/bin/saw-spec-gen --version
          if ($LASTEXITCODE -ne 0) { throw "saw-spec-gen --version failed (exit $LASTEXITCODE)" }

      - name: Regenerate docs + proof manifest
        run: |
          $ErrorActionPreference = 'Stop'
          # verify-cpp is a native binary; handle its (sometimes non-zero, e.g.
          # a genuine disproof) exit codes ourselves via $LASTEXITCODE rather
          # than letting pwsh 7.4+ throw on the first non-zero native exit.
          $PSNativeCommandUseErrorActionPreference = $false

          $pretty = (Resolve-Path '.tools/bin/pretty-specs').Path
          $ssg    = (Resolve-Path '.tools/bin/saw-spec-gen').Path

          $spec      = 'cpp/saw/SDEP_cpp.cry'
          $impl      = 'cpp/src/decision.cpp'
          $verifyOut = 'verify_out'
          $manifest  = 'proof_manifest.json'
          $docs      = 'docs'

          # Render flags shared by the initial (Step 0) and badge (Step 4) renders.
          $renderArgs = @(
            '--docfx',
            '--logo',       'assets/sat-pudding.png',
            '--favicon',    'assets/fabicon.png',
            '--extra-docs', 'extra_docs:Formal Verification'
          )

          function Invoke-Pretty([string[]]$a) {
            Write-Host "  > pretty-specs $($a -join ' ')" -ForegroundColor DarkGray
            & $pretty @a
            if ($LASTEXITCODE -ne 0) { throw "pretty-specs exited with code $LASTEXITCODE" }
          }

          # Clean prior outputs so we never publish a stale mixture.
          Remove-Item -Recurse -Force $verifyOut, $docs, $manifest, pipeline.log -ErrorAction SilentlyContinue

          Start-Transcript -Path pipeline.log | Out-Null
          try {
            # -- Step 0: initial render (no proof badges) --
            Invoke-Pretty (@($spec, '-o', $docs) + $renderArgs)

            # -- Step 1: emit the function list --
            New-Item -ItemType Directory -Force -Path $verifyOut | Out-Null
            $fnList = Join-Path $verifyOut 'function_list.json'
            Invoke-Pretty @($spec, '--emit-function-list', '-o', $fnList)

            # -- Step 2: verify each function via the saw-spec-gen `verify-cpp`
            #    CLI. This replaces the old pipeline.ps1 -> verify.ps1 wrappers;
            #    verify-cpp runs compile -> AST -> gen-verify -> SAW and writes
            #    out_<fn>/result.json itself. Cryptol-only helpers with no C++
            #    symbol soft-exit as not_attempted via --spec-only-on-missing. --
            $functions = Get-Content $fnList | ConvertFrom-Json
            $passed = 0; $failed = 0
            foreach ($fn in $functions) {
              $name   = $fn.name
              $outDir = Join-Path $verifyOut "out_$name"
              Write-Host "  Verifying $name ..." -NoNewline
              & $ssg verify-cpp `
                --cpp-file     $impl `
                --cryptol-spec $spec `
                --cryptol-fn   $name `
                --function     $name `
                --output       $outDir `
                --include-dir  cpp/include `
                --cxx-standard c++20 `
                --clang-flag   -fexceptions `
                --clang-flag   -fno-inline `
                --spec-only-on-missing
              if ($LASTEXITCODE -eq 0) {
                Write-Host ' ok' -ForegroundColor Green; $passed++
              } else {
                Write-Host " FAILED (exit $LASTEXITCODE)" -ForegroundColor Yellow; $failed++
                # Record the failure so --adapt-saw-results still classifies it.
                New-Item -ItemType Directory -Force -Path $outDir | Out-Null
                @{ cryptol_fn = $name; status = 'error'
                   message = "verify-cpp exited with code $LASTEXITCODE" } |
                  ConvertTo-Json | Set-Content (Join-Path $outDir 'result.json')
              }
            }
            Write-Host "  $passed passed, $failed failed" -ForegroundColor $(if ($failed) { 'Yellow' } else { 'Green' })

            # -- Step 3: adapt SAW results into the proof manifest --
            Invoke-Pretty @('--adapt-saw-results', $verifyOut, '--manifest-output', $manifest)

            # -- Step 4: final render with proof badges --
            Invoke-Pretty (@($spec, '--proof-status', $manifest, '-o', $docs) + $renderArgs)
          }
          finally {
            Stop-Transcript | Out-Null
          }

          if (-not (Test-Path docs/index.md)) {
            throw "Regeneration failed: docs/ was not produced. See pipeline.log."
          }

      - name: Package rendered tree for the build job
        run: |
          # Hand the freshly rendered tree to the docfx job. Exclude the
          # heavy/irrelevant dirs: git metadata, SAW output, and the
          # checked-out tool sources. Write the archive OUTSIDE the tree
          # being read ($RUNNER_TEMP) so tar can't try to include its own
          # growing output ("file changed as we read it").
          tar `
            --warning=no-file-changed `
            --exclude='./.git' `
            --exclude='./verify_out' `
            --exclude='./.tools' `
            -czf "$env:RUNNER_TEMP/rendered.tar.gz" .

      - name: Upload rendered tree
        uses: actions/upload-artifact@v4
        with:
          name: rendered-tree
          path: ${{ runner.temp }}/rendered.tar.gz
          retention-days: 3

      - name: Upload pipeline log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regen-pipeline-log
          path: pipeline.log
          if-no-files-found: ignore
          retention-days: 7

  # ── 2. Render the DocFX site from the regenerated docs/ ──────────────────
  build:
    name: Build DocFX site
    needs: regen
    runs-on: ubuntu-latest
    steps:
      - name: Download rendered tree
        uses: actions/download-artifact@v4
        with:
          name: rendered-tree

      - name: Unpack rendered tree
        run: tar -xzf rendered.tar.gz

      - name: Set up .NET (for docfx tool)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build site
        run: docfx docfx.json --warningsAsErrors false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── 3. Deploy to GitHub Pages ────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
