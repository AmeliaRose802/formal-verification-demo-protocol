name: Publish CI image

# Builds and publishes the pre-baked toolchain image used by the Linux
# verify job in verify.yml. The image bundles LLVM 20.1.6, SAW 1.5 with
# bundled solvers, PowerShell 7.6.2, Rust stable + llvm-tools-preview,
# and the latest saw-spec-gen release so the verify job skips the ~1 GB
# install dance every run.
#
# Triggers:
#   - Push to main that changes the Dockerfile or the installer script
#     whose pinned versions the image tracks.
#   - Manual workflow_dispatch (re-publish without a code change, e.g.
#     to pick up a new saw-spec-gen release while versions are pinned).
#
# Publishes to:
#   ghcr.io/<owner>/<repo>-ci:latest   (always)
#   ghcr.io/<owner>/<repo>-ci:<sha>    (immutable per-commit tag)
#
# After the first successful publish, flip the package visibility to
# Public in the repo's Packages settings so verify.yml's `container:`
# step can pull without credentials. Until then the `credentials:` block
# in verify.yml uses GITHUB_TOKEN which works for private packages too.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/ci-install.ps1'
      - '.github/workflows/publish-ci-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase owner/repo — GHCR rejects mixed-case names.
      - name: Compute image tag
        id: tag
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo_lower="$(basename '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lower}/${repo_lower}-ci"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Publishing to ${image}:latest and :${GITHUB_SHA::12}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:latest
            ${{ steps.tag.outputs.image }}:${{ github.sha }}
          # Registry-side layer cache so re-publishes only rebuild
          # changed layers (e.g. bumping a single ARG version).
          cache-from: type=registry,ref=${{ steps.tag.outputs.image }}:buildcache
          cache-to:   type=registry,ref=${{ steps.tag.outputs.image }}:buildcache,mode=max
